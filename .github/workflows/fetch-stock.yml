name: fetch-stock
on:
  workflow_dispatch:
jobs:
  stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CC0 stock photos
        run: |
          mkdir -p stock
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, time
          QUERIES = {
            "kinako": "kinako soybean flour",
            "soybean": "soybeans bowl",
            "ricebread": "gluten free bread loaf",
            "pancake": "pancakes breakfast plate",
            "curry": "curry rice spices",
            "spice": "spices bowls wooden",
            "babyfood": "baby food bowl spoon",
            "kitchen": "kitchen table linen light",
            "flour": "flour baking white",
            "family": "family breakfast table",
          }
          index=[]
          for key, q in QUERIES.items():
              url = "https://api.openverse.org/v1/images/?" + urllib.parse.urlencode(
                  {"q": q, "license": "cc0", "page_size": 6, "mature": "false"})
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"bis-bot/1.0"})
                  data = json.load(urllib.request.urlopen(req, timeout=40))
              except Exception as e:
                  print("query-err", key, e); continue
              n=0
              for r in data.get("results", []):
                  src = r.get("url")
                  if not src: continue
                  n+=1
                  name=f"{key}_{n:02d}.jpg"
                  try:
                      rq=urllib.request.Request(src, headers={"User-Agent":"Mozilla/5.0"})
                      b=urllib.request.urlopen(rq, timeout=40).read()
                      open("stock/"+name,"wb").write(b)
                      index.append({"file":name,"query":q,"title":r.get("title"),
                                    "creator":r.get("creator"),"license":r.get("license"),
                                    "source":r.get("foreign_landing_url")})
                      print("ok", name, len(b))
                  except Exception as e:
                      print("dl-err", name, e)
                  if n>=4: break
              time.sleep(1)
          json.dump(index, open("stock/index.json","w"), ensure_ascii=False, indent=1)
          print("total", len(index))
          EOF
      - name: Commit
        run: |
          git config user.name "bis-bot"
          git config user.email "bot@bis.local"
          git add stock
          git diff --cached --quiet || git commit -m "fetch CC0 stock photos"
          git push
