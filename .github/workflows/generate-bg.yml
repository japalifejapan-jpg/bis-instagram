name: generate-bg
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate background images
        run: |
          mkdir -p bg
          python3 - <<'EOF'
          import json, urllib.parse, urllib.request, time
          prompts = json.load(open('bg/prompts.json'))
          for it in prompts:
              q = urllib.parse.quote(it['p'])
              url = f"https://image.pollinations.ai/prompt/{q}?width=1373&height=1031&nologo=true&seed=7"
              p = 'bg/' + it['id'] + '.jpg'
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      data = urllib.request.urlopen(req, timeout=180).read()
                      if len(data) > 20000:
                          open(p, 'wb').write(data)
                          print('ok', p, len(data))
                          break
                      print('small', it['id'], len(data))
                  except Exception as e:
                      print('retry', it['id'], attempt, e)
                  time.sleep(10)
              time.sleep(3)
          EOF
      - name: Commit
        run: |
          git config user.name "bis-bot"
          git config user.email "bot@bis.local"
          git add bg
          git diff --cached --quiet || git commit -m "generate background images"
          git push
